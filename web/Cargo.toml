[package]
name = "wayback-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wayback-core = { path = "../core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Location", "Element", "HtmlElement", "HtmlDivElement", "NodeList", "Navigator", "Clipboard"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
