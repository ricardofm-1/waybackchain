name = "wayback-wallet"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
# The site's domain (zone on this Cloudflare account). Custom domains get
# their DNS records and certificate automatically.
routes = [
  { pattern = "waybackchain.xyz", custom_domain = true },
  { pattern = "www.waybackchain.xyz", custom_domain = true },
]

[build]
command = "worker-build --release"

# One Worker serves the whole site: the static frontend (built by Trunk into
# ../web/dist, including its _headers with the Content-Security-Policy) and
# the API. Only /api/* runs the Worker code; everything else is a static
# asset. Same origin, so the cookies need no CORS.
# Build the frontend first: `cd ../web && trunk build --release`.
[assets]
directory = "../web/dist"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Result and price cache (`wrangler dev` simulates it locally).
[[kv_namespaces]]
binding = "CACHE"
id = "60b147c4f2834cb7ad4019358ede7f0a"

[vars]
# Only needed when the page is served from another origin; production is
# same-origin. Local dev overrides this in .dev.vars.
ALLOWED_ORIGIN = ""

# Secrets (set with `wrangler secret put NAME`; locally in .dev.vars):
#   HMAC_SECRET, TURNSTILE_SECRET, ALCHEMY_KEY, HELIUS_KEY, BLOCKFROST_KEY
