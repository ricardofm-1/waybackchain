[package]
name = "wayback-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wayback-core = { path = "../core" }
worker = "0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
futures-util = { version = "0.3", default-features = false }
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std"] }
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
# Fixture recording (RECORD=1 cargo test); never part of the Worker build.
ureq = { version = "=3.4.2", features = ["json"] }
