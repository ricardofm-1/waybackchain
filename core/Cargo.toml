[package]
name = "wayback-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wayback_core"

[dependencies]
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
sha2 = "0.10"
sha3 = "0.10"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
